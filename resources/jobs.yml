# Two instructor jobs. Job parameters reach every notebook task; CONFIG.py picks up catalog, source_schema and
# user_schema from them and otherwise uses its own values.
#
# workshop_setup    00_generate_workshop_data -> 01_prebuild_shared_gold   (run once before the workshop)
# workshop_dry_run  01_bronze_to_gold_lab -> 02_spark_dos_and_donts -> 03_genie_code_challenge_solution
#                   (optional instructor rehearsal into user_schema, with auto_solve=true)

resources:
  jobs:
    workshop_setup:
      name: "Spark Do's & Don'ts - setup (generate shared data)"
      description: >
        Generates the star schema, the wide telemetry table, the narrow telemetry/session tables and the raw
        CSV/Parquet/JSON files into the shared source schema, then runs the bronze-to-gold lab auto-solved into
        the same schema so the Genie notebooks have gold tables to build on. Every table and folder is replaced
        on rerun. Participant schemas are created separately (instructor_setup/02_create_participant_schemas).
      max_concurrent_runs: 1
      queue:
        enabled: true
      performance_target: ${var.performance_target}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source_schema
          default: ${var.source_schema}
        - name: fact_rows
          default: ${var.fact_rows}
        - name: workshop_tag
          default: ${var.workshop_tag}
        - name: warehouse_id
          default: ${var.warehouse_id}
      environments: &workshop_environments
        - environment_key: serverless
          spec:
            environment_version: ${var.environment_version}
      tasks:
        - task_key: generate_workshop_data
          environment_key: serverless
          notebook_task:
            notebook_path: ../instructor_setup/00_generate_workshop_data.py
        - task_key: prebuild_shared_gold
          depends_on:
            - task_key: generate_workshop_data
          environment_key: serverless
          notebook_task:
            notebook_path: ../instructor_setup/01_prebuild_shared_gold.py

    workshop_dry_run:
      name: "Spark Do's & Don'ts - dry run into a user schema"
      description: >
        Runs the bronze-to-gold lab with every exercise auto-solved (and publishes its dashboard), then every
        Don't/Do pair and the Genie Code challenge solution, reading the shared source data and writing to
        user_schema (which must already exist). Takes roughly 25 minutes. Requires the setup job.
      max_concurrent_runs: 1
      queue:
        enabled: true
      performance_target: ${var.performance_target}
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: source_schema
          default: ${var.source_schema}
        - name: user_schema
          default: ${var.user_schema}
        - name: dont_timeout_seconds
          default: ${var.dont_timeout_seconds}
        - name: auto_solve
          default: "true"
        - name: workshop_tag
          default: ${var.workshop_tag}
        - name: warehouse_id
          default: ${var.warehouse_id}
      environments: *workshop_environments
      tasks:
        - task_key: bronze_to_gold_lab
          environment_key: serverless
          max_retries: 0
          notebook_task:
            notebook_path: ../notebooks/01_bronze_to_gold_lab.py
        - task_key: dos_and_donts
          depends_on:
            - task_key: bronze_to_gold_lab
          environment_key: serverless
          max_retries: 0  # a retry would rerun every Don't; investigate instead
          notebook_task:
            notebook_path: ../notebooks/02_spark_dos_and_donts.py
        - task_key: genie_code_challenge_solution
          depends_on:
            - task_key: dos_and_donts
          environment_key: serverless
          notebook_task:
            notebook_path: ../notebooks/03_genie_code_challenge_solution.py
