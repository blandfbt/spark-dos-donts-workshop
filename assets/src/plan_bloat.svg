<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1495b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e86ab"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a7d44"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f7281"/></marker></defs><rect width="1000" height="330" fill="#ffffff"/><rect x="20" y="30" width="470" height="280" rx="12" fill="#fff" stroke="#d1495b" stroke-width="2"/><rect x="36" y="15" width="74" height="30" rx="15" fill="#d1495b" stroke="#d1495b" stroke-width="1.5"/><text x="73" y="36" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">DON'T</text><rect x="124" y="18" width="247.20000000000002" height="24" rx="0" fill="#fff" stroke="#fff" stroke-width="0"/><text x="130" y="36" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b3139" font-weight="bold" text-anchor="start">withColumn() × 300 in a loop</text><rect x="40" y="60" width="430" height="225" rx="6" fill="#fbe9eb" stroke="#d1495b" stroke-width="1"/><rect x="52" y="72" width="406" height="201" rx="6" fill="#fff" stroke="#d1495b" stroke-width="1"/><rect x="64" y="84" width="382" height="177" rx="6" fill="#fbe9eb" stroke="#d1495b" stroke-width="1"/><rect x="76" y="96" width="358" height="153" rx="6" fill="#fff" stroke="#d1495b" stroke-width="1"/><rect x="88" y="108" width="334" height="129" rx="6" fill="#fbe9eb" stroke="#d1495b" stroke-width="1"/><rect x="100" y="120" width="310" height="105" rx="6" fill="#fff" stroke="#d1495b" stroke-width="1"/><text x="255" y="182" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d1495b" font-weight="bold" text-anchor="middle">Project(Project(Project(…)))</text><text x="255" y="202" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d1495b" font-weight="normal" text-anchor="middle">300 levels deep</text><text x="255" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f7281" font-weight="normal" text-anchor="middle" font-style="italic">re-analyzed on every df.columns inside the loop → O(n²)</text><rect x="510" y="30" width="470" height="280" rx="12" fill="#fff" stroke="#3a7d44" stroke-width="2"/><rect x="526" y="15" width="50" height="30" rx="15" fill="#3a7d44" stroke="#3a7d44" stroke-width="1.5"/><text x="551" y="36" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">DO</text><rect x="590" y="18" width="272.40000000000003" height="24" rx="0" fill="#fff" stroke="#fff" stroke-width="0"/><text x="596" y="36" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b3139" font-weight="bold" text-anchor="start">withColumns({...}) / one select</text><rect x="560" y="120" width="370" height="70" rx="8" fill="#e8f3ea" stroke="#3a7d44" stroke-width="1.5"/><text x="745" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3a7d44" font-weight="bold" text-anchor="middle">Project([300 expressions])</text><text x="745" y="172" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3a7d44" font-weight="normal" text-anchor="middle">one level</text><text x="745" y="298" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f7281" font-weight="normal" text-anchor="middle" font-style="italic">build the expressions in a Python list/dict, apply once</text></svg>