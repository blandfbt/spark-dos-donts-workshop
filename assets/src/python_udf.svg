Arial, sans-serif" font-size="15" fill="#1b3139" font-weight="bold" text-anchor="middle">Python worker</text><text x="505.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f7281" font-weight="normal" text-anchor="middle">one row at a time</text><line x1="212" y1="125" x2="416" y2="125" stroke="#d1495b" stroke-width="2.5" marker-end="url(#ar)"/><text x="314" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1495b" font-weight="normal" text-anchor="middle">serialize rows</text><line x1="416" y1="178" x2="214" y2="178" stroke="#d1495b" stroke-width="2.5" marker-end="url(#ar)"/><text x="314" y="197" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d1495b" font-weight="normal" text-anchor="middle">deserialize results</text><text x="315" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5f7281" font-weight="normal" text-anchor="middle" font-style="italic">opaque to the optimizer · no filter pushdown through it</text><text x="315" y="272" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5f7281" font-weight="normal" text-anchor="middle" font-style="italic">pandas UDF: same trip, but in Arrow batches (faster)</text><rect x="630" y="30" width="350" height="280" rx="12" fill="#fff" stroke="#3a7d44" stroke-width="2"/><rect x="646" y="15" width="50" height="30" rx="15" fill="#3a7d44" stroke="#3a7d44" stroke-width="1.5"/><text x="671" y="36" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">DO</text><rect x="710" y="18" width="163.20000000000002" height="24" rx="0" fill="#fff" stroke="#fff" stroke-width="0"/><text x="716" y="36" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1b3139" font-weight="bold" text-anchor="start">built-in functions</text><rect x="680" y="90" width="250" height="120" rx="8" fill="#e8f3ea" stroke="#3a7d44" stroke-width="1.5"/><text x="805.0" y="147.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1b3139" font-weight="bold" text-anchor="middle">Photon / JVM</text><text x="805.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f7281" font-weight="normal" text-anchor="middle">when · round · regexp · date</text><text x="805" y="250" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5f7281" font-weight="normal" text-anchor="middle" font-style="italic">stays native and vectorized</text><text x="805" y="272" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5f7281" font-weight="normal" text-anchor="middle" font-style="italic">the optimizer understands it</text></svg>