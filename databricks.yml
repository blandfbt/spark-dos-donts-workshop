# Spark Do's & Don'ts + Genie workshop - Apex Motorsports Parts (a fictional company).
#
# INSTRUCTOR ONLY. Participants don't deploy this bundle: they clone the repo into their workspace folder, set
# USER_SCHEMA in CONFIG.py and run the notebooks by hand. The bundle is how the instructor prepares the data:
#
#   databricks bundle deploy -t dev -p <profile>
#   databricks bundle run    -t dev -p <profile> workshop_setup        # generate shared data + prebuild lab tables
#   databricks bundle run    -t dev -p <profile> workshop_dry_run --params user_schema=<your_schema>   # optional
#
# Participant schemas and grants: run instructor_setup/02_create_participant_schemas by hand (it needs the email list).
# Everything runs on serverless compute. The catalog must already exist.
bundle:
  name: spark_dos_donts_workshop

include:
  - resources/*.yml

# Tag every bundle resource that supports tags so workshop assets are easy to filter. The notebooks apply the
# same tag to the Unity Catalog schemas, volumes and tables they create. The key is "workshop_name" rather than
# "workshop" because some accounts govern a "workshop" tag key with fixed values.
presets:
  tags:
    workshop_name: ${var.workshop_tag}

sync:
  exclude:
    - assets/src/**    # SVG sources of the notebook graphics; only the rendered PNGs are needed
    - presentation/**  # the slide deck isn't needed in the workspace

variables:
  workshop_tag:
    description: Value of the "workshop_name" tag put on every job and Unity Catalog object of this workshop.
    default: spark_dos_donts
  catalog:
    description: Existing Unity Catalog catalog for the workshop (same as CATALOG in CONFIG.py).
    default: dbx_workshop_dev
  source_schema:
    description: Shared, read-only source schema the setup job writes (same as SOURCE_SCHEMA in CONFIG.py).
    default: shared
  user_schema:
    description: Existing schema the dry-run job writes to (the instructor's own participant schema).
    default: ""
  fact_rows:
    description: Rows in fact_orders. 100M makes the Don'ts clearly hurt; 20M is a quick smoke test.
    default: "100000000"
  dont_timeout_seconds:
    description: Each "Don't" cell is cancelled after this many seconds and recorded as timed out.
    default: "120"
  warehouse_id:
    description: SQL warehouse for the lab's AI/BI dashboard. Leave empty to use the first serverless warehouse found.
    default: ""
  environment_version:
    description: Serverless environment version. 5 or later is required for df.cache().
    default: "5"
  performance_target:
    description: Serverless job performance target (PERFORMANCE_OPTIMIZED or STANDARD).
    default: PERFORMANCE_OPTIMIZED

targets:
  dev:
    mode: development
    default: true
    # Pick the workspace with `-p <cli-profile>`, or uncomment and set it here:
    # workspace:
    #   host: https://<your-workspace>.cloud.databricks.com
